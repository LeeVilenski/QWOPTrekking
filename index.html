<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fb6e0">
<title>QWOP Trekking: Ryan's Annapurna</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb6e0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: "Trebuchet MS", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 8px;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
  #controls.show { display: flex; }
  .btn { pointer-events: auto; flex: 1; height: 18vh; max-height: 120px; min-height: 60px; border-radius: 18px;
    background: rgba(255,255,255,0.28); border: 3px solid rgba(255,255,255,0.7); color: #fff;
    font-weight: bold; font-size: 20px; display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); touch-action: none; }
  .btn.mid { flex: 0.8; }
  .btn.lean { flex: 0.7; background: rgba(255,210,80,0.25); font-size: 17px; }
  .btn.down { background: rgba(255,255,255,0.6); }
  #menu { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 62px; width: 44px; height: 44px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.35); color: #fff; font-size: 20px; cursor: pointer; }
  #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,20,35,0.6); z-index: 10; }
  #pause.show { display: flex; }
  #pause .card { display: flex; flex-direction: column; gap: 12px; min-width: 240px; padding: 22px; border-radius: 18px;
    background: rgba(20,35,55,0.92); text-align: center; }
  #pause .title { color: #ffd34d; font-size: 30px; font-weight: bold; margin-bottom: 4px; }
  #pause button { font: bold 18px "Trebuchet MS", sans-serif; padding: 12px; border-radius: 12px; border: none;
    background: #ffd34d; color: #1d2a3a; cursor: pointer; }
  #pause button + button { background: rgba(255,255,255,0.85); }
  #packing { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,20,35,0.6); z-index: 9; padding: 10px; box-sizing: border-box; }
  #packing.show { display: flex; }
  .pcard { width: min(720px, 100%); max-height: 100%; overflow-y: auto; padding: 16px; border-radius: 18px;
    background: rgba(20,35,55,0.95); color: #fff; box-sizing: border-box; touch-action: pan-y; }
  .ptitle { color: #ffd34d; font-size: 26px; font-weight: bold; text-align: center; }
  .psub { text-align: center; font-weight: bold; margin-top: 2px; }
  .pfore { text-align: center; color: #cfe6ff; font-size: 14px; margin: 6px 0 10px; }
  .pitems { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .pitem { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 12px; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); color: #fff; font: 14px "Trebuchet MS", sans-serif; }
  .pitem.on { border-color: #ffd34d; background: rgba(255,211,77,0.18); }
  .pitem .pi { font-size: 22px; }
  .pitem .pn { flex: 1; font-weight: bold; }
  .pitem .pn small { display: block; font-weight: normal; color: #cfd8e3; font-size: 11.5px; }
  .pitem .pk { color: #ffd34d; font-size: 12px; white-space: nowrap; }
  .pweight { text-align: center; margin: 12px 0 8px; }
  .pweight small { color: #aab; }
  .pbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.2); margin: 6px auto 4px; max-width: 320px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #6ad16a, #f0b030, #e04a3a); }
  .pgo { display: block; width: 100%; font: bold 20px "Trebuchet MS", sans-serif; padding: 12px; border-radius: 12px;
    border: none; background: #ffd34d; color: #1d2a3a; cursor: pointer; }
  .pgo { position: sticky; bottom: 0; box-shadow: 0 -8px 16px rgba(20,35,55,0.95); }
  @media (max-height: 520px) {
    .pcard { padding: 10px 12px; }
    .ptitle { font-size: 20px; }
    .psub { font-size: 13px; }
    .pfore { font-size: 12px; margin: 2px 0 6px; }
    .pitems { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 5px; }
    .pitem { padding: 4px 8px; font-size: 12.5px; gap: 6px; }
    .pitem .pi { font-size: 17px; }
    .pitem .pn small { font-size: 10px; }
    .pweight { margin: 6px 0 4px; font-size: 13px; }
    .pweight small { display: none; }
    .pbar { margin: 3px auto 0; }
    .pgo { font-size: 17px; padding: 8px; }
  }
  #mute { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.35); color: #fff; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <div class="btn lean" data-act="B">◀<br>BACK</div>
  <div class="btn" data-act="L">LEFT<br>leg</div>
  <div class="btn mid" data-act="P">POLES</div>
  <div class="btn" data-act="R">RIGHT<br>leg</div>
  <div class="btn lean" data-act="F">FWD<br>▶</div>
</div>
<button id="mute" aria-label="Toggle sound">♪</button>
<button id="menu" aria-label="Pause">☰</button>
<div id="packing"></div>
<div id="pause">
  <div class="card">
    <div class="title">Paused</div>
    <button data-pause="resume">Resume</button>
    <button data-pause="restart">Restart this day</button>
    <button data-pause="days">Choose a day</button>
  </div>
</div>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
